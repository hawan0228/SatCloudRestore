[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satcloudrestore"
version = "0.1.0"
description = "Educational conditional diffusion for synthetic cloud restoration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "torch>=2.0", "torchvision>=0.15", "numpy>=1.24", "scipy>=1.10",
  "scikit-image>=0.21", "opencv-python-headless>=4.8", "matplotlib>=3.7",
  "pandas>=2.0", "PyYAML>=6.0", "tqdm>=4.65", "Pillow>=9.5",
  "gradio>=4.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["satcloudrestore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
