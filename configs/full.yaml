paths:
  data_dir: data
  raw_dir: data/raw
  manifest: data/splits/manifest.json
  checkpoint_dir: checkpoints
  results_dir: results
seed: 42
experiment_name: full
image_size: 64
splits: {train: 21600, validation: 2700, test: 2700}
cloud:
  coverage_range: [0.10, 0.60]
  opacity_range: [0.35, 1.0]
  sigma_range: [1.0, 4.0]
  octaves: 3
  fixed_coverages: [0.10, 0.30, 0.50, 0.70]
normalization: minus_one_one
model:
  in_channels: 7
  out_channels: 3
  base_channels: 64
  channel_multipliers: [1, 2, 4]
  time_dim: 256
diffusion: {timesteps: 1000, beta_schedule: cosine, ddim_steps: 50}
training:
  batch_size: 64
  epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0001
  mask_weight: 4.0
  ema_decay: 0.995
  amp: true
  grad_clip: 1.0
  checkpoint_frequency: 1
  preview_frequency: 1
  num_workers: 4
  gradient_accumulation: 1
evaluation: {batch_size: 8, uncertainty_samples: 8, telea_radius: 3}
