paths:
  data_dir: data
  raw_dir: data/raw
  manifest: data/splits/manifest.json
  checkpoint_dir: checkpoints
  results_dir: results
seed: 42
experiment_name: pilot_cosine_resize_gpu
image_size: 64
splits: {train: 12000, validation: 1000, test: 1000}
cloud:
  coverage_range: [0.10, 0.60]
  opacity_range: [0.35, 1.0]
  sigma_range: [1.0, 4.0]
  octaves: 3
  fixed_coverages: [0.10, 0.30, 0.50, 0.70]
normalization: minus_one_one
model:
  in_channels: 7
  out_channels: 3
  base_channels: 32
  channel_multipliers: [1, 2, 4]
  time_dim: 128
  upsample_mode: resize_conv
diffusion:
  timesteps: 200
  beta_schedule: cosine
  ddim_steps: 25
  require_near_zero_terminal: true
training:
  max_steps: 500
  batch_size: 16
  gradient_accumulation: 4
  epochs: 20
  learning_rate: 0.0002
  weight_decay: 0.0001
  mask_weight: 4.0
  ema_decay: 0.995
  amp: true
  grad_clip: 1.0
  checkpoint_frequency: 1
  preview_frequency: 1
  num_workers: 2
evaluation: {batch_size: 8, uncertainty_samples: 8, telea_radius: 3}
